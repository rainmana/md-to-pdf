[build]
# Typst is a large dependency graph; two jobs also fit smaller developer machines.
jobs = 2

[target.x86_64-unknown-linux-musl]
linker = "musl-gcc"

[target.aarch64-unknown-linux-musl]
linker = "musl-gcc"

[target.x86_64-pc-windows-msvc]
# Bundle the MSVC runtime so users do not need the Visual C++ redistributable.
rustflags = ["-C", "target-feature=+crt-static"]
