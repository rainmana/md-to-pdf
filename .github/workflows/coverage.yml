name: Coverage

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: '2'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'

jobs:
  coverage:
    name: Rust source line coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain and LLVM tools
        run: |
          rustup show
          rustup component add llvm-tools-preview
      - name: Cache Cargo dependencies and instrumented build outputs
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: coverage-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', '.cargo/config.toml') }}
          restore-keys: |
            coverage-${{ runner.os }}-
      - name: Install pinned coverage tool
        run: cargo install cargo-llvm-cov --locked --version 0.8.4
      - name: Test coverage publication safeguards
        run: python3 scripts/test-publish-coverage.py
      - name: Measure Rust coverage
        run: |
          mkdir -p .analysis/coverage
          cargo llvm-cov --locked --all-targets --json --output-path .analysis/coverage/coverage.json
          cargo llvm-cov report --lcov --output-path .analysis/coverage/coverage.lcov
      - name: Render coverage badge and scoped report
        run: |
          python3 scripts/coverage-badge.py .analysis/coverage/coverage.json \
            --lcov .analysis/coverage/coverage.lcov \
            --badge .analysis/coverage/coverage.svg \
            --report .analysis/coverage/COVERAGE.md \
            --source-commit "$(git rev-parse HEAD)" \
            --date "$(date -u +%F)" \
            --platform "$(rustc -vV | sed -n 's/^host: //p')" \
            --toolchain "$(rustc --version)"
          cat .analysis/coverage/COVERAGE.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage report
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: rust-coverage-${{ github.sha }}
          path: |
            .analysis/coverage/coverage.json
            .analysis/coverage/coverage.lcov
            .analysis/coverage/coverage.svg
            .analysis/coverage/COVERAGE.md
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish master coverage badge
    needs: coverage
    if: >-
      needs.coverage.result == 'success' &&
      github.ref == 'refs/heads/master' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out trusted source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download this run's measured coverage
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: rust-coverage-${{ github.sha }}
          path: ${{ runner.temp }}/coverage-payload
      - name: Publish badge and report to coverage-data
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
        run: |
          python3 scripts/publish-coverage.py \
            --payload "$RUNNER_TEMP/coverage-payload" \
            --remote "https://github.com/$GITHUB_REPOSITORY.git" \
            --source-sha "$SOURCE_SHA" \
            --run-url "$RUN_URL"
