name: Coverage

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: '2'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'

jobs:
  coverage:
    name: Rust source line coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain and LLVM tools
        run: |
          rustup show
          rustup component add llvm-tools-preview
      - name: Cache Cargo dependencies and instrumented build outputs
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: coverage-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', '.cargo/config.toml') }}
          restore-keys: |
            coverage-${{ runner.os }}-
      - name: Install pinned coverage tool
        run: cargo install cargo-llvm-cov --locked --version 0.8.4
      - name: Measure Rust coverage
        run: |
          mkdir -p .analysis/coverage
          cargo llvm-cov --locked --all-targets --json --output-path .analysis/coverage/coverage.json
          cargo llvm-cov report --lcov --output-path .analysis/coverage/coverage.lcov
      - name: Render coverage badge and scoped report
        run: |
          python3 scripts/coverage-badge.py .analysis/coverage/coverage.json \
            --lcov .analysis/coverage/coverage.lcov \
            --badge .analysis/coverage/coverage.svg \
            --report .analysis/coverage/COVERAGE.md \
            --source-commit "$(git rev-parse HEAD)" \
            --date "$(date -u +%F)" \
            --platform "$(rustc -vV | sed -n 's/^host: //p')" \
            --toolchain "$(rustc --version)"
          cat .analysis/coverage/COVERAGE.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage report
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: rust-coverage-${{ github.sha }}
          path: |
            .analysis/coverage/coverage.json
            .analysis/coverage/coverage.lcov
            .analysis/coverage/coverage.svg
            .analysis/coverage/COVERAGE.md
          if-no-files-found: error
          retention-days: 14
