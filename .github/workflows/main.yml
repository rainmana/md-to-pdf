name: Rust CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: '2'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'

jobs:
  test:
    name: Test ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            extension: ''
          - os: macos-15
            target: aarch64-apple-darwin
            extension: ''
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            extension: '.exe'
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: |
          rustup show
          rustup target add '${{ matrix.target }}'
      - name: Cache Cargo dependencies and build outputs
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ci-${{ matrix.target }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', '.cargo/config.toml') }}
          restore-keys: |
            ci-${{ matrix.target }}-
      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check
      - name: Check bundled license notices
        if: runner.os == 'Linux'
        run: |
          cargo fetch --locked
          python3 scripts/collect-licenses.py --check
      - name: Check Clippy warnings
        if: runner.os == 'Linux'
        run: cargo clippy --locked --all-targets --target '${{ matrix.target }}' -- -D warnings
      - name: Test
        run: |
          cargo test --locked --all-targets --target '${{ matrix.target }}'
          cargo test --locked --doc --target '${{ matrix.target }}'
      - name: Build CLI binaries
        run: cargo build --locked --bins --target '${{ matrix.target }}'
      - name: Smoke test both binary names from an empty directory
        env:
          TARGET: ${{ matrix.target }}
          EXE_EXTENSION: ${{ matrix.extension }}
        run: |
          smoke_dir="$RUNNER_TEMP/md-to-pdf-ci-smoke"
          mkdir -p "$smoke_dir"
          printf '# Standalone conversion\n\nNo browser, external renderer, or installed fonts are needed.\n' > "$smoke_dir/input.md"
          cd "$smoke_dir"
          for binary in md-to-pdf md2pdf; do
            "$GITHUB_WORKSPACE/target/$TARGET/debug/$binary$EXE_EXTENSION" input.md --output "$binary.pdf"
            test "$(head -c 5 "$binary.pdf")" = '%PDF-'
          done
